[project]
name = "netgent"
version = "2.0.0a0"
description = "Agent-based automation of network application workflows using LLMs and browser automation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "SNL-UCSB" },
]
dependencies = [
    "patchright>=1.62.1",
    "playwright>=1.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
netgent = "netgent.cli:main"

[project.optional-dependencies]
generate = [
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-google-genai>=4.3.4",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
]
# `claude-code:<model>` route: the local Claude Code CLI as a locked-down chat
# model (subscription-billed fallback when the API budget is out).
claude-code = [
    "langchain-claude-code",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv.sources]
langchain-claude-code = { path = "../langchain-claude-code", editable = true }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "PLE", "ASYNC", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netgent"]
