# Playwright locators pierce OPEN shadow roots automatically, so ordinary
# CSS/role locators reach elements inside the shadow DOM form.
name: form-shadow
version: "1"
start_state: init

states:
  - id: init
  - id: loaded
    conditions:
      - {type: title_contains, text: Shadow Form}
      - {type: selector_visible, selector: "#name"}
  - id: submitted
    conditions:
      - {type: selector_visible, selector: "#secret"}

transitions:
  - {id: open, source: init, target: loaded, action: {type: goto, url: "{base}/shadow.html"}}
  - id: fill_name
    source: loaded
    target: loaded
    action: {type: fill, locator: [{fn: locator, args: ["#name"]}], text: "Grace Hopper"}
  - id: submit
    source: loaded
    target: submitted
    action: {type: click, locator: [{fn: get_by_role, args: [button], kwargs: {name: Submit}}]}

control_sequence: [open, fill_name, submit]
